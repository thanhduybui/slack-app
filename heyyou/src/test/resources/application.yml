spring:
  datasource:
    url: jdbc:h2:mem:heyyou_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

app:
  jwt:
    secret: test-secret-key-with-at-least-32-bytes
    access-token-ttl: 15m
    refresh-token-ttl: 30d
